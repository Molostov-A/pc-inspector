[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pcinspector"
version = "0.1.0"
description = "Локальный анализ дискового пространства Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "mcp>=2,<3", "send2trash"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
include = ["pcinspector*"]

[tool.setuptools.package-data]
pcinspector = ["web/index.html", "web/css/*", "web/js/*.js", "web/js/components/*.js", "web/js/pages/*.js", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
